name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./HelpDeskPro.slnx

      - name: Build Release
        run: dotnet build ./HelpDeskPro.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./HelpDeskPro.slnx --configuration Release --no-build --logger "trx;LogFileName=HelpDeskPro.Tests.trx" --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
